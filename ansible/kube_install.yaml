---
- name: Configure Kubernetes Prerequisites with CRI-O
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Disable swap space
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Set SELinux to permissive mode
      command: setenforce 0
      ignore_errors: yes
      
    - name: Disable SELinux permanently in config
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'

    - name: Load kernel modules
      command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Ensure modules load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl parameters
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply sysctl parameters
      command: sysctl --system

    - name: Add CRI-O YUM repository
      copy:
        dest: /etc/yum.repos.d/crio.repo
        content: |
          [cri-o]
          name=CRI-O
          baseurl=https://pkgs.k8s.io/addons:/cri-o:/stable:/v1.31/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/addons:/cri-o:/stable:/v1.31/rpm/repodata/repomd.xml.key

    - name: Install CRI-O
      dnf:
        name: cri-o
        state: present

    - name: Restart and enable CRI-O
      systemd:
        name: crio
        state: restarted
        enabled: yes

    - name: Add Kubernetes YUM repository
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.31/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.31/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install Kubernetes components
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: yes

- name: Mount etcd volume on Masters
  hosts: masters
  become: yes
  tasks:
    - name: Create etcd directory
      file:
        path: /var/lib/etcd
        state: directory
        mode: '0700'

    - name: Check if etcd volume is formatted
      command: blkid /dev/nvme1n1
      register: blkid_out
      ignore_errors: yes

    - name: Format the EBS volume as XFS
      command: mkfs.xfs /dev/nvme1n1
      when: blkid_out.rc != 0

    - name: Mount etcd volume
      mount:
        path: /var/lib/etcd
        src: /dev/nvme1n1
        fstype: xfs
        state: mounted
